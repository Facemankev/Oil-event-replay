name: Integrated application checks
on:
  pull_request:
    branches: [main, dad/mat-3-cohort-evidence]
permissions:
  contents: read
jobs:
  matching:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --test tests/*.cjs tests/*.mjs
      - name: Build from the real databases, safely repeat, and audit without network
        run: |
          python3 -m historical --db work/matching-prices.sqlite backfill
          python3 -m historical --db work/matching-prices.sqlite update
          python3 -m world_events --db work/matching-events.sqlite import
          python3 -m world_events --db work/matching-events.sqlite import
          python3 -m matching.validate_prices --db work/matching-prices.sqlite --output work/audit.json
          python3 -m matching.build --output work/catalog.json
      - name: Build new horizons and reproduce sample demonstrations
        run: |
          python3 -m matching.build --horizons 1,3,5,10,20 --traits matching/traits.json --output work/cohort-catalog.json
          node matching/demo.mjs --check
          bash .claude/hooks/guard.sh scan
          python3 -m app.data_status --check
          git diff --exit-code 46ef646 -- data/historical data/world-event-research.json data/brent-brexit-source.csv data/apple-brexit-source.csv data/events.js data/research-data.js historical world_events/seed.json world_events/schema.sql world_events/events.py world_events/research.py world_events/design.css preview .claude matching/engine.mjs matching/analysis.mjs matching/build.py matching/catalog.json matching/cohort-catalog.json matching/traits.json matching/design.css
          git show c2bcb92:trading/core.mjs | cmp - trading/core.mjs
      - name: Install browser test dependencies
        run: |
          python3 -m pip install playwright==1.64.1
          python3 -m playwright install --with-deps chromium webkit
          matching_chromium_path="$(python3 -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          sudo ln -sf "$matching_chromium_path" /usr/bin/chromium
      - name: Matching and existing browser regressions
        run: |
          python3 tests/matching_browser_test.py
          python3 tests/browser_test.py
          python3 tests/historical_browser_test.py
          python3 tests/world_events_browser_test.py
          python3 tests/branding_preview_browser_test.py
          python3 tests/paper_browser_test.py
          python3 tests/application_browser_test.py
          python3 tests/application_browser_test.py --browser webkit
      - name: Check the deployed public preview in both browser engines
        run: |
          python3 tests/application_browser_test.py --base-url https://market-ripple-app-review.g86hz2pjsh.chatgpt.site
          python3 tests/application_browser_test.py --browser webkit --base-url https://market-ripple-app-review.g86hz2pjsh.chatgpt.site
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: application-browser-reports
          path: work/application/
