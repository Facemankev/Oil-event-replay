{
  "name": "Market Ripple required checks",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "synchronize",
        "reopened",
        "ready_for_review"
      ]
    },
    "merge_group": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "required-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "offline": {
      "name": "Offline data and unit checks",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "run": "python3 -m ci.offline_checks"
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "required-offline-logs",
            "path": "work/ci-offline/*.log\nwork/ci-offline/results.json",
            "retention-days": 3,
            "compression-level": 9
          }
        }
      ]
    },
    "browser": {
      "name": "Browser ${{ matrix.engine }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "engine": [
            "chromium",
            "webkit"
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Install pinned real browser engine",
          "run": "python3 -m pip install playwright==1.64.1\npython3 - <<'PYBROWSER'\nimport os\nfrom pathlib import Path\nfrom playwright.sync_api import sync_playwright\nwith sync_playwright() as p:\n    engine = os.environ['CI_BROWSER_ENGINE']\n    executable = Path(getattr(p, engine).executable_path)\n    if not executable.is_file() or not os.access(executable, os.X_OK):\n        raise RuntimeError('Pinned real browser is absent from the official image')\n    if engine == 'chromium':\n        link = Path('/usr/bin/chromium')\n        link.unlink(missing_ok=True)\n        link.symlink_to(executable)\nPYBROWSER",
          "timeout-minutes": 25
        },
        {
          "name": "Prove failure evidence capture",
          "run": "python3 -m ci.check_capture --browser ${{ matrix.engine }}"
        },
        {
          "name": "All required fixture-only browser suites",
          "run": "python3 -m ci.run_browser --browser ${{ matrix.engine }}",
          "timeout-minutes": 8
        },
        {
          "uses": "actions/upload-artifact@v4",
          "if": "always()",
          "with": {
            "name": "browser-evidence-${{ matrix.engine }}",
            "path": "work/ci-browser/${{ matrix.engine }}/",
            "if-no-files-found": "error",
            "retention-days": 3,
            "compression-level": 9
          },
          "timeout-minutes": 3
        }
      ],
      "container": {
        "image": "mcr.microsoft.com/playwright/python:v1.64.1-noble@sha256:330d401ae23c905896a0c26c66c36fc971b621519e7b11b435a8328d7bf6e031",
        "options": "--ipc=host"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "PLAYWRIGHT_BROWSERS_PATH": "/ms-playwright",
        "CI_BROWSER_ENGINE": "${{ matrix.engine }}"
      }
    },
    "required": {
      "name": "Market Ripple required checks",
      "if": "${{ always() }}",
      "needs": [
        "offline",
        "browser"
      ],
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "name": "Fail closed unless every required job passed",
          "env": {
            "OFFLINE_RESULT": "${{ needs.offline.result }}",
            "BROWSER_RESULT": "${{ needs.browser.result }}"
          },
          "run": "set -eu\ntest \"$OFFLINE_RESULT\" = \"success\"\ntest \"$BROWSER_RESULT\" = \"success\""
        }
      ]
    }
  }
}
