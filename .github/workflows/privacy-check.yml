name: Privacy check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Look for keys, passwords, emails and phone numbers added by this pull request
        run: |
          git fetch origin main
          bash .claude/hooks/guard.sh scan
